server {
    listen 80 default_server;
    server_name _;

    root /opt/drupal/web;
    index index.php;
    client_max_body_size 64M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/drupal/web$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;      # 512 KB — holds a full Gin admin page in memory
        fastcgi_read_timeout 120s;
    }

    location ~ /\.ht { deny all; }
    location ~ /\. { access_log off; log_not_found off; deny all; }

    # Image-style derivatives are the ONLY static path that legitimately needs Drupal
    # to generate the file on demand. Must precede the generic asset block below.
    location ~ ^/sites/default/files/styles/ {
        try_files $uri @rewrite;
    }

    # Everything else: if it is not on disk it does not exist. Never boot Drupal for it.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|otf|map)$ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }

    location @rewrite {
        rewrite ^ /index.php;
    }
}
