# HTTP/1.1 + empty Connection header are BOTH required for the upstream keepalive
# pools declared in default.conf.template to be used at all.
proxy_http_version 1.1;
proxy_set_header   Connection "";

proxy_ssl_session_reuse on;

# Fail fast instead of inheriting the 60s default — a dead upstream address should
# cost 3s and a retry, not a minute.
proxy_connect_timeout 3s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_next_upstream   error timeout http_502 http_504;

proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $http_host;

# A Gin admin page is far larger than nginx's ~32 KB default, so every admin
# response was being spooled to a temp file on disk before being relayed.
proxy_buffer_size       32k;
proxy_buffers           16 32k;
proxy_busy_buffers_size 64k;