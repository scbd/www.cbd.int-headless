# Local development stack — NOT used in production (production = Docker Swarm, see origin/deployment-stacks)
# All values come from .env. `${VAR:?}` = fail fast if the variable is missing.
name: cbd-www

services:
  router:
    image: scbd/www-router:local
    ports:
      - "80:80"
    environment:
      NUXT_HOST: ${NUXT_HOST:?}
      NUXT_PORT: ${NUXT_PORT:?}
      DRUPAL_HOST: ${DRUPAL_HOST:?}
      DRUPAL_PORT: ${DRUPAL_PORT:?}
      LEGACY_CMS_HOST: ${LEGACY_CMS_HOST:?}
      LEGACY_CMS_PORT: ${LEGACY_CMS_PORT:?}
      LEGACY_WWW_FALLBACK_URL: ${LEGACY_WWW_FALLBACK_URL:?}
      GAIA_DOCS_S3_ENDPOINT: ${GAIA_DOCS_S3_ENDPOINT:?}
      API_HOST: ${API_HOST:?}
      API_PORT: ${API_PORT:?}
    depends_on: [nuxt, drupal]
    restart: unless-stopped

  nuxt:
    image: scbd/www-nuxt:local
    ports:
      - "3000:3000"            # optional, for hitting Nuxt directly
    environment:
      NODE_ENV: development
      # (inside this container `localhost` is Nuxt itself). Direct to Drupal, never via router.
      NUXT_DRUPAL_BASE_URL: http://${DRUPAL_HOST:?}:${DRUPAL_PORT:?}
      NUXT_API_BASE_URL: ${NUXT_API_BASE_URL:?}
      NUXT_ORT_URL: ${NUXT_ORT_URL:?}
      NUXT_PUBLIC_GTAG_ID: ${NUXT_PUBLIC_GTAG_ID:?}
    depends_on: [drupal]
    restart: unless-stopped

  drupal:
    image: scbd/www-drupal:local
    ports:
      - "8081:80"              # direct Drupal access + admin UI
    environment:
      DRUPAL_DATABASE_HOST: ${DRUPAL_DATABASE_HOST:?}
      DRUPAL_DATABASE_PORT: ${DRUPAL_DATABASE_PORT:?}
      DRUPAL_DATABASE_DB_NAME: ${DRUPAL_DATABASE_DB_NAME:?}
      DRUPAL_DATABASE_USERNAME: ${DRUPAL_DATABASE_USERNAME:?}
      DRUPAL_DATABASE_PASSWORD: ${DRUPAL_DATABASE_PASSWORD:?}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:?}
      DRUPAL_TRUSTED_HOST: ${DRUPAL_TRUSTED_HOST:?}
      DRUPAL_REDIS_HOST: ${DRUPAL_REDIS_HOST:?}
      DRUPAL_REDIS_PORT: ${DRUPAL_REDIS_PORT:?}
      DRUPAL_REDIS_DB: ${DRUPAL_REDIS_DB:?}
      DRUPAL_REDIS_CACHE_PREFIX: ${DRUPAL_REDIS_CACHE_PREFIX:?}
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
      - drupal_sync:/var/drupal/sync
    depends_on: [mariadb, redis]
    restart: unless-stopped

  mariadb:
    image: mariadb:10.6.21-focal
    ports:
      - "33061:3306"           # optional, for a local SQL client
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?}
      MARIADB_USER: ${MARIADB_USER:?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:8.2.1
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  drupal_files:
  drupal_sync:
  db_data:
  redis_data:
