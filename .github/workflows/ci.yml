# Secrets required:
#
# Registry (org-level — must be shared with this repo):
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token
#
# Deployment webhooks (repo-level, optional — comma-separated, one per Portainer service):
#   WEBHOOK_URL_DEV     - Portainer service webhook URL(s) for dev redeploy
#   WEBHOOK_URL_MASTER  - Portainer service webhook URL(s) for master redeploy

name: CI

on:
  push:
    branches: ['**']
    # Calver tags: YYYY.N.N (e.g. 2026.34.0) — no leading v
    tags: ['[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --frozen-lockfile --network-concurrency 1
      - run: yarn lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: www-nuxt,   context: . }
          - { name: www-router, context: infra/router }
          - { name: www-drupal, context: infra/drupal }
    env:
      # Calver tags and master/dev push to Docker Hub; other branches build only.
      PUSH: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ env.PUSH }}
          # Branch names aren't always valid image tags; only pushed refs need a real one.
          tags: scbd/${{ matrix.name }}:${{ env.PUSH == 'true' && github.ref_name || 'ci' }}
          # Release builds skip the cache so unpinned apt/composer deps pick up the latest patches.
          no-cache: ${{ github.ref_type == 'tag' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.ref_type != 'tag' && format('type=gha,scope={0},mode=max', matrix.name) || '' }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      # Portainer webhooks — non-critical, a failed redeploy never blocks CI.
      - name: Trigger Portainer webhooks
        env:
          URLS: ${{ github.ref_name == 'master' && secrets.WEBHOOK_URL_MASTER || secrets.WEBHOOK_URL_DEV }}
        run: |
          tr ',' '\n' <<< "$URLS" | while read -r url; do
            if [ -n "$url" ]; then curl -fsS -X POST "$url" || echo "::warning::Portainer webhook failed"; fi
          done
